version: "2"
sql:
  - engine: postgresql
    schema: internal/adapter/postgres/migrations
    queries: internal/adapter/postgres/queries
    gen:
      go:
        package: gen
        out: internal/adapter/postgres/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
